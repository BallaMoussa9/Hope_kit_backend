networks:
  hope-network:
    driver: bridge

volumes:
  hope-db-data:
  hope-redis-data:
  hope-app-storage:

services:

  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: hope-backend-app:latest
    container_name: hope_app
    restart: unless-stopped
    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html
      - hope-app-storage:/var/www/html/storage

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      CONTAINER_ROLE: app

      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hope_kitnene}
      DB_USERNAME: ${DB_USERNAME:-hope}
      DB_PASSWORD: ${DB_PASSWORD:-hope_secret}

      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_DOMAIN: ""

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      REDIS_PORT: 6379

      SANCTUM_STATEFUL_DOMAINS: "localhost:5173,localhost:5174,localhost:3000,127.0.0.1:5173,127.0.0.1:5174"

      IVR_WEBHOOK_SECRET: ${IVR_WEBHOOK_SECRET:-change-me-in-production}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - hope-network


  webserver:
    image: nginx:1.27-alpine
    container_name: hope_webserver
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8000}:80"

    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - hope-network


  db:
    image: mysql:8.4
    container_name: hope_db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hope_kitnene}
      MYSQL_USER: ${DB_USERNAME:-hope}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hope_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}

    volumes:
      - hope-db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro

    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"

    networks:
      - hope-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-root_secret}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: hope_redis
    restart: unless-stopped

    volumes:
      - hope-redis-data:/data

    networks:
      - hope-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  queue-worker:
    image: hope-backend-app:latest
    container_name: hope_queue_worker
    restart: unless-stopped
    working_dir: /var/www/html

    command: >
      sh -c "
      until nc -z app 9000;
      do sleep 2;
      done &&
      php artisan queue:work redis
      --sleep=3
      --tries=3
      --max-time=3600
      "

    volumes:
      - ./backend:/var/www/html
      - hope-app-storage:/var/www/html/storage

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      CONTAINER_ROLE: queue

      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hope_kitnene}
      DB_USERNAME: ${DB_USERNAME:-hope}
      DB_PASSWORD: ${DB_PASSWORD:-hope_secret}

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      SESSION_DRIVER: database

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      REDIS_PORT: 6379

      SANCTUM_STATEFUL_DOMAINS: "localhost:5173,localhost:5174,localhost:3000,127.0.0.1:5173,127.0.0.1:5174"

      IVR_WEBHOOK_SECRET: ${IVR_WEBHOOK_SECRET:-change-me-in-production}

    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

    networks:
      - hope-network


  scheduler:
    image: hope-backend-app:latest
    container_name: hope_scheduler
    restart: unless-stopped
    working_dir: /var/www/html

    command: >
      sh -c "
      while true;
      do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done
      "

    volumes:
      - ./backend:/var/www/html
      - hope-app-storage:/var/www/html/storage

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      CONTAINER_ROLE: scheduler

      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hope_kitnene}
      DB_USERNAME: ${DB_USERNAME:-hope}
      DB_PASSWORD: ${DB_PASSWORD:-hope_secret}

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      SESSION_DRIVER: database

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      REDIS_PORT: 6379

      SANCTUM_STATEFUL_DOMAINS: "localhost:5173,localhost:5174,localhost:3000,127.0.0.1:5173,127.0.0.1:5174"

      IVR_WEBHOOK_SECRET: ${IVR_WEBHOOK_SECRET:-change-me-in-production}

    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

    networks:
      - hope-network


  phpmyadmin:
    image: phpmyadmin:5
    container_name: hope_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}

    ports:
      - "${PMA_PORT:-8081}:80"

    depends_on:
      - db

    networks:
      - hope-network
